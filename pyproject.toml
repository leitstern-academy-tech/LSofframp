[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lsofframp"
version = "0.0.1"
description = "Local, repeatable checks of whether a cloud export package is usable without the provider."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alper Ece", email = "alperece@lsacademytech.com" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/leitstern-academy-tech/LSofframp"
Issues = "https://github.com/leitstern-academy-tech/LSofframp/issues"

[project.scripts]
lsofframp = "lsofframp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lsofframp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"